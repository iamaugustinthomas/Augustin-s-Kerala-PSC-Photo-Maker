    <line x1="10" y1="17" x2="10" y2="22" stroke="rgba(255,255,255,0.6)" stroke-width="1.2" />
    <line x1="14" y1="17" x2="14" y2="22" stroke="rgba(255,255,255,0.6)" stroke-width="1.2" />
