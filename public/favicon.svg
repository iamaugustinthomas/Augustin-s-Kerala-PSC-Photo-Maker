<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="apple-blue-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff" />
      <stop offset="100%" stop-color="#0066cc" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Apple App Icon Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#apple-blue-gradient)" filter="url(#shadow)" />
